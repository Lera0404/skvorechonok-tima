<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐦 Помоги Скворчонку Тиме!</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🐦 Помоги Скворчонку Тиме!</h1>

<p class="subtitle">
Весеннее путешествие по синтаксису (5 класс)
</p>

<div id="start">

<div class="intro">

<p>

🐦 Скворчонок Тима прилетел домой после долгой зимы.

Но злой Весенний ветер перепутал все предложения!

Помоги Тиме выполнить задания по синтаксису,

и он сможет построить уютное гнездо.

</p>

</div>

<center>

<button onclick="startGame()">

🌸 Начать игру

</button>

</center>

</div>

<div id="game">

<div class="progress">

<div id="bar"></div>

</div>

<div class="score">

⭐ Очки:
<span id="score">0</span>

</div>

<div class="question"

id="question">

</div>

<div id="answers">

</div>

</div>

<div class="finish"

id="finish">

<h2>

🏆 Молодец!

</h2>

<p id="result"></p>

<button onclick="location.reload()">

Играть ещё

</button>

</div>

</div>
<script>

const questions = [

{
q:"Что такое простое предложение?",
a:[
"Группа слов",
"Группа слов, выражающая законченную мысль и имеющая грамматическую основу",
"Любой текст"
],
c:1
},

{
q:"Найди грамматическую основу: «На ветвях набухли почки».",
a:[
"На ветвях",
"Почки набухли",
"Набухли почки"
],
c:2
},

{
q:"Какое предложение является вопросительным?",
a:[
"Светит солнце.",
"Когда прилетят скворцы?",
"Берегите птиц!"
],
c:1
},

{
q:"Выбери правильный знак: «Как красиво весной»",
a:[".","?","!"],
c:2
},

{
q:"Найди определение.",
a:[
"весенний цветок",
"цветок",
"растёт"
],
c:0
}

];

let current=0;
let score=0;

function startGame(){

document.getElementById("start").style.display="none";
document.getElementById("game").style.display="block";

showQuestion();

}

function showQuestion(){

let q=questions[current];

document.getElementById("question").innerHTML=
(current+1)+". "+q.q;

let answers=document.getElementById("answers");

answers.innerHTML="";

document.getElementById("bar").style.width=
((current)/questions.length*100)+"%";

q.a.forEach((text,index)=>{

let btn=document.createElement("button");

btn.className="answer";

btn.innerHTML=text;

btn.onclick=()=>check(index);

answers.appendChild(btn);

});

}

function check(index){

let buttons=document.querySelectorAll(".answer");

buttons.forEach(b=>b.disabled=true);

if(index==questions[current].c){

buttons[index].classList.add("correct");

score+=10;

}else{

buttons[index].classList.add("wrong");

buttons[questions[current].c].classList.add("correct");

}

document.getElementById("score").innerHTML=score;

setTimeout(()=>{

current++;

if(current<questions.length){

showQuestion();

}else{

finishGame();

}

},1200);

}

function finishGame(){

document.getElementById("game").style.display="none";

document.getElementById("finish").style.display="block";

document.getElementById("result").innerHTML=

"🐦 Скворчонок Тима построил гнездо!<br><br>" +

"⭐ Ты набрал <b>"+score+"</b> очков из "+(questions.length*10)+".<br><br>"+

(score>=40 ?

"🌸 Отличный результат!" :

"🌱 Попробуй пройти игру ещё раз!");

}

<script src="script.js"></script>

</body>
</html>
<script src="script.js"></script>
</body>
</html>
