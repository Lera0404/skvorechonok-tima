<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐦 Помоги Скворчонку Тиме!</title>

<style>

body{
margin:0;
font-family:Segoe UI,Tahoma,sans-serif;
background:linear-gradient(#b8f3d1,#e7ffd6,#fff3cf);
overflow-x:hidden;
}

.container{
max-width:800px;
margin:30px auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#2f855a;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:20px;
}

.intro{
background:#f0fff4;
border-left:6px solid #48bb78;
padding:15px;
border-radius:10px;
line-height:1.6;
}

button{
background:#48bb78;
color:white;
border:none;
padding:14px 30px;
border-radius:30px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#38a169;
}

#game{
display:none;
}

.question{
font-size:22px;
font-weight:bold;
margin-bottom:20px;
}

.answer{
display:block;
width:100%;
padding:14px;
margin:10px 0;
font-size:17px;
border-radius:10px;
border:2px solid #cbd5e0;
background:white;
cursor:pointer;
text-align:left;
transition:.2s;
}

.answer:hover{
background:#f0fff4;
border-color:#48bb78;
}

.correct{
background:#c6f6d5!important;
}

.wrong{
background:#fed7d7!important;
}

.progress{
height:18px;
background:#eee;
border-radius:30px;
overflow:hidden;
margin-bottom:20px;
}

.progress div{
height:100%;
width:0%;
background:#48bb78;
transition:.4s;
}

.score{
font-weight:bold;
color:#2f855a;
margin-bottom:20px;
font-size:18px;
}

.finish{
display:none;
text-align:center;
}

.finish h2{
color:#2f855a;
}

</style>
</head>

<body>

<div class="container">

<h1>🐦 Помоги Скворчонку Тиме!</h1>

<p class="subtitle">
Весеннее путешествие по синтаксису (5 класс)
</p>

<div id="start">

<div class="intro">

<p>

🐦 Скворчонок Тима прилетел домой после долгой зимы.

Но злой Весенний ветер перепутал все предложения!

Помоги Тиме выполнить задания по синтаксису,

и он сможет построить уютное гнездо.

</p>

</div>

<center>

<button onclick="startGame()">

🌸 Начать игру

</button>

</center>

</div>

<div id="game">

<div class="progress">

<div id="bar"></div>

</div>

<div class="score">

⭐ Очки:
<span id="score">0</span>

</div>

<div class="question"

id="question">

</div>

<div id="answers">

</div>

</div>

<div class="finish"

id="finish">

<h2>

🏆 Молодец!

</h2>

<p id="result"></p>

<button onclick="location.reload()">

Играть ещё

</button>

</div>

</div>
<script>

const questions = [

{
q:"Что такое простое предложение?",
a:[
"Группа слов",
"Группа слов, выражающая законченную мысль и имеющая грамматическую основу",
"Любой текст"
],
c:1
},

{
q:"Найди грамматическую основу: «На ветвях набухли почки».",
a:[
"На ветвях",
"Почки набухли",
"Набухли почки"
],
c:2
},

{
q:"Какое предложение является вопросительным?",
a:[
"Светит солнце.",
"Когда прилетят скворцы?",
"Берегите птиц!"
],
c:1
},

{
q:"Выбери правильный знак: «Как красиво весной»",
a:[".","?","!"],
c:2
},

{
q:"Найди определение.",
a:[
"весенний цветок",
"цветок",
"растёт"
],
c:0
}

];

let current=0;
let score=0;

function startGame(){

document.getElementById("start").style.display="none";
document.getElementById("game").style.display="block";

showQuestion();

}

function showQuestion(){

let q=questions[current];

document.getElementById("question").innerHTML=
(current+1)+". "+q.q;

let answers=document.getElementById("answers");

answers.innerHTML="";

document.getElementById("bar").style.width=
((current)/questions.length*100)+"%";

q.a.forEach((text,index)=>{

let btn=document.createElement("button");

btn.className="answer";

btn.innerHTML=text;

btn.onclick=()=>check(index);

answers.appendChild(btn);

});

}

function check(index){

let buttons=document.querySelectorAll(".answer");

buttons.forEach(b=>b.disabled=true);

if(index==questions[current].c){

buttons[index].classList.add("correct");

score+=10;

}else{

buttons[index].classList.add("wrong");

buttons[questions[current].c].classList.add("correct");

}

document.getElementById("score").innerHTML=score;

setTimeout(()=>{

current++;

if(current<questions.length){

showQuestion();

}else{

finishGame();

}

},1200);

}

function finishGame(){

document.getElementById("game").style.display="none";

document.getElementById("finish").style.display="block";

document.getElementById("result").innerHTML=

"🐦 Скворчонок Тима построил гнездо!<br><br>" +

"⭐ Ты набрал <b>"+score+"</b> очков из "+(questions.length*10)+".<br><br>"+

(score>=40 ?

"🌸 Отличный результат!" :

"🌱 Попробуй пройти игру ещё раз!");

}

</script>

</body>
</html>
